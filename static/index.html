<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="utf-8">
    <title>chat json fastapi</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="room-header">
        <span class="header-item">User: <strong id="user-display">...</strong></span>
        <span class="header-item">Phòng: <strong id="room-display">...</strong></span>
    </div>

    <div id="chat-box"></div>
    <div id="typing-status"></div>

    <div class="controls">
        <input type="text" id="message-input" maxlength="1000" placeholder="Nhập tin nhắn..." autocomplete="off">
        <button id="send-btn">Gửi</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
